name: CI

# القسم 19 من "دليل الإصلاح الجذري لمنظومة مرقاب" — بوابة جودة موحَّدة قبل
# الدمج: typecheck → lint (--max-warnings=0) → اختبارات وحدة → اختبارات DB
# حقيقية (قاعدة PostgreSQL محلية فارغة، migrations من الصفر) → E2E → build.
# يطابق ترتيب "verify" في package.json بالضبط، لكن كخطوات منفصلة هنا حتى
# يظهر أي فشل بوضوح في أي مرحلة تحديداً بدل سطر واحد مدمج.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  # قيم عامة غير حساسة كافية لـtypecheck/lint/build/E2E العامة (صفحات لا
  # تتطلب جلسة مصادَقة حقيقية) — لا تُستخدم أبداً ضد مشروع Supabase سحابي
  # حقيقي. اختبارات DB (test:db) تستبدلها لاحقاً بقيم المكدّس المحلي
  # الفعلي بعد `supabase start` (راجع خطوة "Run DB integration tests").
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  PROVIDER_CREDENTIALS_ENCRYPTION_KEY: ci-test-encryption-key-not-for-production-use

jobs:
  quality:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (max-warnings=0)
        run: npm run lint

      - name: Unit tests
        run: npm run test

  db-tests:
    name: PostgreSQL integration tests (test:db)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # القسم 16/18.5: قاعدة فارغة تماماً → تطبيق كل الـmigrations من الصفر
      # (`supabase start` يشغّل مكدّساً محلياً كاملاً؛ الأعمدة/RLS/RPCs التي
      # تختبرها ملفات supabase/tests/*.dbtest.ts يجب أن تنتج فعلياً من هذا
      # التطبيق، لا من افتراض مسبق). `supabase db reset` داخل npm run test:db
      # نفسه يعيد التطبيق من الصفر مرة أخرى قبل كل تشغيلة اختبارات تحديداً.
      - name: Start local Supabase stack
        run: supabase start

      - name: Run DB integration tests
        run: npm run test:db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  e2e-tests:
    name: End-to-end tests (test:e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (builds + starts production server internally)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build
