name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # build يحتاج فعلياً NEXT_PUBLIC_SUPABASE_URL/NEXT_PUBLIC_SUPABASE_ANON_KEY/
      # SUPABASE_SERVICE_ROLE_KEY (راجع app/lib/supabase.ts وsupabaseAdmin.ts) —
      # بلا GitHub Secrets حقيقية هذه الخطوة تفشل بوضوح بدل تخطّيها صامتة، حتى
      # يعرف أي مطوّر مستقبلي بالضبط ما الناقص. أضف الأسرار الثلاثة تحت
      # Settings → Secrets and variables → Actions لتفعيل هذه الخطوة فعلياً.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
